    <!--
      Two Devanagari-native families, both carrying their own Latin:
        Khand (Indian Type Foundry) — condensed signage, for headlines and numerals
        Mukta (Ek Type)            — body and UI, in all three languages

      Down from four families to two, which matters on a rural connection.
      Noto Sans Devanagari is the fallback: it ships preinstalled on effectively
      every Android handset, so Hindi and Marathi render correctly on first paint
      even if the webfonts never arrive.

      TODO before submission: self-host these two as subset woff2 and drop the
      cross-origin requests entirely.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Khand:wght@400;500;600;700&family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!--
      Map CSS is imported by the map component itself (MapLibre), so it is
      bundled and code-split with it rather than fetched from a CDN on every
      page load. One less blocking cross-origin request before first paint.
    -->
    <script type="module" crossorigin src="/assets/index-BeI-JoX9.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Cvgi9GIY.css">
  </head>

  </body>
